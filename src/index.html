<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>SOFARY GMAO</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#351266">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SOFARY">
  <link rel="apple-touch-icon" href="icon-192x192.png">
  <script>
    // Applique le thème avant l'affichage pour éviter un flash blanc en mode sombre
    (function () {
      try {
        var t = localStorage.getItem('sofary_theme') || 'systeme';
        var sombre = t === 'sombre' || (t === 'systeme' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (sombre) { document.documentElement.classList.add('dark'); document.documentElement.style.colorScheme = 'dark'; }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
