<header class="h-14 bg-white border-b border-gray-200 flex items-center px-3 sm:px-6 gap-3">

  <!-- Hamburger mobile -->
  <button
    (click)="layout.toggle()"
    class="lg:hidden p-2 rounded-lg text-gray-500 hover:bg-gray-100 hover:text-primary-600 transition-colors shrink-0"
    aria-label="Ouvrir le menu">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
    </svg>
  </button>

  <!-- Titre -->
  <div class="flex-1 min-w-0">
    <h1 class="text-sm font-semibold text-gray-800 truncate">
      <span class="hidden sm:inline">SOFARY <span class="text-gray-300 font-light">·</span> </span>Gestion de Flotte
    </h1>
  </div>

  <!-- Notifications -->
  <a routerLink="/notifications" class="relative p-2 text-gray-500 hover:text-primary-600 rounded-lg hover:bg-gray-100 shrink-0">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
    </svg>
  </a>

  <!-- Avatar + dropdown -->
  <div class="relative shrink-0" data-profil-menu>
    <button (click)="toggleMenu()"
      class="flex items-center gap-2 p-1 rounded-xl hover:bg-gray-100 transition-colors">
      <div class="w-8 h-8 bg-primary-600 rounded-full flex items-center justify-center">
        <span class="text-white text-xs font-bold">
          {{ user()?.prenom?.[0] }}{{ user()?.nom?.[0] }}
        </span>
      </div>
      <span class="hidden sm:block text-sm font-medium text-gray-700 max-w-[120px] truncate">
        {{ user()?.prenom }} {{ user()?.nom }}
      </span>
      <svg class="hidden sm:block w-3.5 h-3.5 text-gray-400 transition-transform"
        [class.rotate-180]="menuOuvert()"
        fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
      </svg>
    </button>

    @if (menuOuvert()) {
      <div class="absolute right-0 top-full mt-2 w-52 bg-white rounded-2xl shadow-xl border border-gray-100 py-1.5 z-50">
        <!-- Info user -->
        <div class="px-4 py-2.5 border-b border-gray-100">
          <p class="text-xs font-semibold text-gray-800 truncate">{{ user()?.prenom }} {{ user()?.nom }}</p>
          <p class="text-xs text-gray-400 truncate">{{ user()?.email }}</p>
        </div>
        <!-- Mon profil -->
        <a routerLink="/profil" (click)="menuOuvert.set(false)"
          class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50 transition-colors">
          <svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
          Mon profil
        </a>
        <!-- Séparateur -->
        <div class="border-t border-gray-100 my-1"></div>
        <!-- Déconnexion -->
        <button (click)="deconnecter()"
          class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 transition-colors">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
          Déconnexion
        </button>
      </div>
    }
  </div>

</header>
